name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [develop, cicd, api]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax check
        run: find app public tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Composer security audit
        run: composer audit --locked || true

  test:
    name: Test (PHP ${{ matrix.php }})
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}

      - name: Run PHPUnit
        env:
          JWT_SECRET: ci-test-jwt-secret
          JWT_TTL: '3600'
          JWT_ISSUER: kcu-api-ci
          JWT_AUDIENCE: kcu-clients-ci
        run: |
          if [ "${{ matrix.php }}" = "8.3" ]; then
            mkdir -p build/logs
            vendor/bin/phpunit --coverage-text --coverage-clover=build/logs/clover.xml
          else
            vendor/bin/phpunit --no-coverage
          fi

      - name: Upload coverage
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/logs/clover.xml
          if-no-files-found: ignore
